name: ai-harness
services:
    postgres:
        image: ai-harness-postgres-vector:17-0.8.7
        build:
            context: .
            dockerfile: postgres-vector.Dockerfile
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?Missing private database configuration}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing private database configuration}
            POSTGRES_DB: ${POSTGRES_DB:?Missing private database configuration}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 2s
            timeout: 3s
            retries: 25
volumes:
    postgres-data:
        name: ai-harness_postgres_data
