name: ai-harness-production

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'

services:
    caddy:
        image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
        restart: unless-stopped
        environment:
            APP_DOMAIN: ${APP_DOMAIN:-localhost}
            HTTP_PORT: ${HTTP_PORT:-80}
            HTTPS_PORT: ${HTTPS_PORT:-443}
        ports:
            - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
            - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
            - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            web:
                condition: service_healthy
        networks: [edge]
        logging: *logging

    web:
        image: ai-harness-web:${HARNESS_IMAGE_TAG:-local}
        build:
            context: ..
            dockerfile: infra/app.Dockerfile
            target: web
        restart: unless-stopped
        init: true
        environment:
            NODE_ENV: production
            HOSTNAME: 0.0.0.0
            PORT: '3000'
            HARNESS_API_URL: http://api:3001
            HARNESS_API_TOKEN: ${HARNESS_API_TOKEN:?Set a stable private service token}
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - node
                - --input-type=module
                - -e
                - "const response = await fetch('http://127.0.0.1:3000/login', { signal: AbortSignal.timeout(4000) }); process.exit(response.ok ? 0 : 1);"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks: [edge, backend]
        logging: *logging

    api:
        image: ai-harness-api:${HARNESS_IMAGE_TAG:-local}
        build:
            context: ..
            dockerfile: infra/app.Dockerfile
            target: api
        restart: unless-stopped
        init: true
        stop_grace_period: 60s
        environment:
            NODE_ENV: production
            API_HOST: 0.0.0.0
            API_PORT: '3001'
            HARNESS_API_TOKEN: ${HARNESS_API_TOKEN:?Set a stable private service token}
            ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:?Set a stable 64-character hex encryption key}
            DATABASE_URL: postgresql://harness:${POSTGRES_PASSWORD:?Set a hex database password}@postgres:5432/harness
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set the system model API key}
            DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
            DEEPSEEK_MODELS: ${DEEPSEEK_MODELS:-deepseek-flash,deepseek-v4-pro}
            DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
            DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-8192}
            DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-120000}
            S3_ENDPOINT: http://minio:9000
            S3_REGION: us-east-1
            S3_BUCKET: harness-knowledge
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set a private object storage access key}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set a private object storage secret}
            S3_FORCE_PATH_STYLE: 'true'
            S3_CREATE_BUCKET: 'true'
            COLLABORATION_POLL_MS: ${COLLABORATION_POLL_MS:-500}
            COLLABORATION_LEASE_MS: ${COLLABORATION_LEASE_MS:-30000}
            COLLABORATION_WAIT_MS: ${COLLABORATION_WAIT_MS:-604800000}
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        # An authenticated service request without an account session must be 401.
        # This checks HTTP startup, not model availability or ongoing DB readiness.
        healthcheck:
            test:
                - CMD
                - node
                - --input-type=module
                - -e
                - "const response = await fetch('http://127.0.0.1:3001/api/account/me', { headers: { Authorization: 'Bearer ' + process.env.HARNESS_API_TOKEN }, signal: AbortSignal.timeout(4000) }); process.exit(response.status === 401 ? 0 : 1);"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s
        networks: [backend, data]
        logging: *logging

    postgres:
        image: ai-harness-production-postgres:17-0.8.7
        build:
            context: .
            dockerfile: postgres-vector.Dockerfile
        restart: unless-stopped
        environment:
            POSTGRES_USER: harness
            POSTGRES_DB: harness
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a hex database password}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 3s
            retries: 20
        networks: [data]
        logging: *logging

    minio:
        image: ${MINIO_IMAGE:-ai-harness-minio:RELEASE.2025-04-22T22-12-26Z}
        build:
            context: .
            dockerfile: minio.Dockerfile
        command: server /data --console-address ':9001'
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set a private object storage access key}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set a private object storage secret}
        volumes:
            - knowledge-objects:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 3s
            retries: 20
        networks: [data]
        logging: *logging

networks:
    edge:
    backend:
    data:
        internal: true

volumes:
    postgres-data:
    knowledge-objects:
    caddy-data:
    caddy-config:
